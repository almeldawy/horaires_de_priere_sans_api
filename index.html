<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horaires des Prières — Ligue Islamique Mondiale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* DARK MODE (Thème par défaut) */
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --bg-color: #0f172a;
    --surface: #1e293b;
    --surface-hover: #334155;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
    --border: #334155;
    --font-main: 'Inter', system-ui, -apple-system, sans-serif;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
    --radius-md: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --card-current: rgba(59, 130, 246, 0.15);
    --card-current-border: #3b82f6;
    
    /* Variables de compatibilité pour le JavaScript existant */
    --neon-yellow: var(--primary);
  }
  
  body.light-theme {
    /* LIGHT MODE */
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-color: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --text-main: #0f172a;
    --text-dim: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --card-current: #eff6ff;
    --card-current-border: #bfdbfe;
    
    --neon-yellow: var(--primary);
  }
  
  body {
    background: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-main);
    min-height: 100vh;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  
  .arabic-bismillah {
    font-family: 'Amiri', serif;
    font-size: 1.8rem;
    color: var(--text-main);
    margin-bottom: 15px;
  }

  h1 {
    font-family: var(--font-main);
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--text-main);
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.2;
  }
  
  h1 span {
    color: var(--primary);
  }

  .subtitle {
    margin-top: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-dim);
    display: inline-block;
  }

  .ornament { display: none; }

  /* SEARCH SECTION */
  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 30px;
    margin-bottom: 30px;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }

  .search-row {
    display: flex;
    gap: 15px;
    align-items: stretch;
  }

  .search-wrapper {
    flex: 1;
    position: relative;
  }

  input[type="text"] {
    width: 100%;
    background: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-main);
    font-family: var(--font-main);
    font-size: 1rem;
    padding: 14px 20px;
    outline: none;
    transition: all 0.2s;
    box-sizing: border-box;
  }

  input[type="text"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
  
  input[type="text"]::placeholder {
    color: var(--text-dim);
  }

  .search-icon { display: none; }

  /* Buttons */
  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-main);
    font-family: var(--font-main);
    font-weight: 500;
    font-size: 0.95rem;
    padding: 0 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:hover {
    background: var(--surface-hover);
  }

  .btn-search {
    background: var(--primary);
    color: white;
    border: none;
  }
  
  .btn-search:hover {
    background: var(--primary-hover);
  }

  .btn-active {
    background: var(--primary) !important;
    color: #ffffff !important;
    border-color: var(--primary) !important;
  }

  /* Action Row */
  .action-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  /* Date nav */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 24px;
    padding: 16px;
    background: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }

  .date-display {
    font-weight: 600;
    font-size: 1.1rem;
    text-align: center;
  }

  .date-hijri {
    display: block;
    color: var(--primary);
    font-weight: 400;
    font-size: 0.9rem;
    margin-top: 4px;
  }

  .btn-nav {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-main);
    width: 40px; height: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-size: 1.2rem;
  }
  
  .btn-nav:hover {
    background: var(--surface-hover);
  }

  /* LOCATION INFO */
  .location-info {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  .location-name {
    font-weight: 600;
    font-size: 1.4rem;
    color: var(--text-main);
  }

  .location-coords {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 6px;
  }

  /* PRAYER CARDS */
  .prayers-grid {
    display: grid;
    gap: 16px;
  }

  .prayer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
  }

  .prayer-card:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .prayer-card.current {
    background: var(--card-current);
    border-color: var(--card-current-border);
  }

  .prayer-left { display: flex; align-items: center; gap: 20px; }
  
  .prayer-index {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 600;
  }

  .prayer-icon {
    font-size: 1.6rem;
  }

  .prayer-names { display: flex; flex-direction: column; }
  
  .prayer-name-fr {
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--text-main);
  }
  
  .prayer-card.current .prayer-name-fr {
    color: var(--primary);
  }

  .prayer-name-ar {
    font-family: 'Amiri', serif;
    color: var(--text-dim);
    font-size: 1.1rem;
    margin-top: 2px;
  }

  .prayer-right { text-align: right; }

  .prayer-time {
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
  }

  .prayer-card.current .prayer-time {
    color: var(--primary);
  }

  .prayer-remaining {
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 500;
    margin-top: 4px;
  }

  /* Method info */
  .method-badge {
    margin-top: 24px;
    padding: 16px;
    border-radius: var(--radius-md);
    background: var(--surface);
    border: 1px solid var(--border);
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  /* Next badge */
  .next-badge {
    background: var(--primary);
    color: white;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 0.7rem;
    margin-left: 10px;
    vertical-align: middle;
    font-weight: 600;
  }

  /* Table des horaires du mois */
  #monthTableContainer {
    display: none;
    margin-top: 30px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }
  
  #monthTableContainer h3 {
    color: var(--text-main) !important;
    font-family: var(--font-main) !important;
    font-weight: 600;
  }

  .month-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
  }

  .month-table th, .month-table td {
    border-bottom: 1px solid var(--border);
    padding: 14px;
    text-align: center;
    font-size: 0.95rem;
  }

  .month-table th {
    background: var(--bg-color);
    font-weight: 600;
    color: var(--text-main);
  }

  .month-table tr:last-child td {
    border-bottom: none;
  }

  .month-table tr:hover td {
    background: var(--surface-hover);
  }
  
  .month-table tr.today-row td {
    background: var(--card-current);
    color: var(--primary);
    font-weight: 600;
  }

  /* Theme toggle - Floating Action Button */
  .theme-toggle {
    display: flex;
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-main);
    font-size: 1.4rem;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-md);
    z-index: 1000;
    transition: all 0.2s ease;
  }
  
  .theme-toggle:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  /* Autocomplete */
  .autocomplete-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 100;
    margin-top: 4px;
    overflow: hidden;
    display: none;
  }
  .autocomplete-list.show { display: block; }
  
  .autocomplete-item {
    padding: 12px 20px;
    color: var(--text-main);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  
  .autocomplete-item:hover {
    background: var(--surface-hover);
  }
  
  .autocomplete-item .city-country {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  /* Loading / Messages */
  .error-msg {
    background: #fee2e2;
    color: #991b1b;
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 24px;
    text-align: center;
    display: none;
    font-weight: 500;
  }
  
  .placeholder-state {
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border);
    padding: 40px;
    text-align: center;
    color: var(--text-dim);
  }
  .placeholder-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }
  .placeholder-title {
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--text-main);
  }
  .placeholder-sub {
    font-size: 0.9rem;
    margin-top: 4px;
  }
  .loading {
    display: none;
    text-align: center;
    margin-bottom: 20px;
  }
  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid var(--border);
    border-top: 3px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .btn-print {
    display: none;
  }

  @media print {
    @page { size: A4 portrait; margin: 1.5cm; }
    body { background: #fff !important; color: #000 !important; }
    .theme-toggle, header, .search-section, .location-info, .prayers-grid, .method-badge { display: none !important; }
    .container { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
    #monthTableContainer { display: block !important; margin-top: 0 !important; box-shadow: none !important; }
    #monthTableContainer h3 { color: #000 !important; text-align: center; font-size: 16pt; margin-bottom: 20px !important; }
    .month-table { width: 100% !important; border: 1px solid #000 !important; border-collapse: collapse !important; }
    .month-table th, .month-table td { border: 1px solid #000 !important; padding: 6px 2px !important; color: #000 !important; font-size: 10pt !important; }
    .month-table th { background: #f0f0f0 !important; font-weight: bold; }
    .month-table tr.today-row td { font-weight: bold !important; background: #e0e0e0 !important; }
  }

  /* RESPONSIVE DESIGN (SMARTPHONES) */
  @media (max-width: 768px) {
    .container { padding: 20px 16px; }
    .search-section { padding: 20px; }
    .search-row { flex-direction: column; gap: 12px; }
    .btn { padding: 14px; width: 100%; justify-content: center; }
    .action-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .date-nav { padding: 12px; gap: 10px; }
    .date-display { font-size: 1rem; }
    .prayer-card { padding: 16px 20px; }
    .prayer-left { gap: 15px; }
    .prayer-time { font-size: 1.6rem; }
    .prayer-name-fr { font-size: 1rem; }
    h1 { font-size: clamp(1.8rem, 8vw, 2.5rem); }
    .location-info { padding: 16px; }
    .theme-toggle { bottom: 20px; right: 20px; width: 44px; height: 44px; font-size: 1.2rem; }
  }
</style>
</head>

<div class="container">

<script src="communes.js"></script>
<script>
// ============================================================
// CITIES DATABASE (latitude, longitude, timezone offset UTC)
// ============================================================
// Import de la base de données depuis communes.js (assumé existant)
// Si le fichier communes.js n'existe pas, pensez à déclarer `const CITIES = []` en fallback.
const CITIES = typeof communesFrance !== 'undefined' ? communesFrance : [];

// ============================================================
// PRAYER TIME CALCULATION — MUSLIM WORLD LEAGUE (MWL)
// Fajr angle: 18°  |  Isha angle: 17°
// Asr: Hanafi (shadow = 2x) can be toggled, default Shafi'i (shadow = 1x)
// ============================================================
const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;
const MWL_FAJR_ANGLE = 18.0;
const MWL_ISHA_ANGLE  = 17.0;

function julianDay(Y, M, D) {
  if (M <= 2) { Y--; M += 12; }
  const A = Math.floor(Y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + D + B - 1524.5;
}

function sunPosition(jd) {
  const D = jd - 2451545.0;
  // Mean anomaly
  const g = (357.529 + 0.98560028 * D) % 360;
  // Mean longitude
  const q = (280.459 + 0.98564736 * D) % 360;
  // Ecliptic longitude
  const L = (q + 1.915 * Math.sin(g * DEG) + 0.020 * Math.sin(2 * g * DEG)) % 360;
  // Obliquity of ecliptic
  const e = 23.439 - 0.0000004 * D;
  // Right ascension (hours)
  let RA = Math.atan2(Math.cos(e * DEG) * Math.sin(L * DEG), Math.cos(L * DEG)) * RAD / 15;
  if (RA < 0) RA += 24;
  // Declination
  const decl = Math.asin(Math.sin(e * DEG) * Math.sin(L * DEG)) * RAD;
  
  // Équation du temps (heures)
  let EqT = (q / 15 - RA + 24) % 24;
  
  // [CORRECTION] Normaliser l'équation du temps autour de zéro
  // Empêche les décalages aberrants si l'écart calcule une valeur brute > 12h
  if (EqT > 12) {
    EqT -= 24; 
  }
  
  return { decl, EqT };
}

function hourAngle(angle, lat, decl) {
  const cosH = (Math.sin(angle * DEG) - Math.sin(lat * DEG) * Math.sin(decl * DEG)) 
             / (Math.cos(lat * DEG) * Math.cos(decl * DEG));
  if (Math.abs(cosH) > 1) return null; // never rises/sets
  return Math.acos(cosH) * RAD / 15;
}

function asrHourAngle(lat, decl, shadowFactor) {
  // Calcul de l'angle pour la prière de l'Asr
  // shadowFactor = 1 pour Shafi'i, 2 pour Hanafi
  const angle = Math.atan(1 / (shadowFactor + Math.tan(Math.abs(lat - decl) * DEG))) * RAD;
  return hourAngle(angle, lat, decl);
}

function calcPrayerTimes(date, lat, lng, tzOffset) {
  const Y = date.getFullYear();
  const M = date.getMonth() + 1;
  const D = date.getDate();
  const jd = julianDay(Y, M, D);

  const { decl, EqT } = sunPosition(jd);

  // Solar noon (local time)
  const Dhuhr = 12 + tzOffset - lng / 15 - EqT;

  // Sun zenith correction: -0.833° for sunrise/sunset (refraction + disc)
  const sunriseDuration = hourAngle(-0.8333, lat, decl);
  if (sunriseDuration === null) return null;

  const Sunrise = Dhuhr - sunriseDuration;
  const Sunset  = Dhuhr + sunriseDuration;

  let Fajr, Isha;
  const fajrH = hourAngle(-MWL_FAJR_ANGLE, lat, decl);
  const ishaH = hourAngle(-MWL_ISHA_ANGLE, lat, decl);

  // [CORRECTION] Gestion des latitudes élevées (Nuits blanches d'été)
  // Si le soleil ne descend jamais à 18° ou 17° sous l'horizon, hourAngle renvoie null.
  if (fajrH === null || ishaH === null) {
    // Calcul de la durée de la nuit (de Sunset à Sunrise le lendemain)
    let nightDuration = (Sunrise + 24) - Sunset; 
    
    // Méthode de repli : 1/7ème de la nuit
    const portion = nightDuration / 7; 
    
    Fajr = Sunrise - portion;
    Isha = Sunset + portion;
  } else {
    // Comportement normal
    Fajr = Dhuhr - fajrH;
    Isha = Dhuhr + ishaH;
  }

  // Asr: Shafi'i (shadow = 1x)
  const asrH = asrHourAngle(lat, decl, 1);
  const Asr = asrH !== null ? Dhuhr + asrH : null;
  
  // Maghrib = Sunset (standard)
  const Maghrib = Sunset;

  return { Fajr, Sunrise, Dhuhr, Asr, Maghrib, Isha };
}

function decimalToTime(decimal) {
  if (decimal === null || isNaN(decimal)) return '--:--';
  
  let h = decimal % 24;
  if (h < 0) h += 24;
  
  let hours = Math.floor(h);
  let minutes = Math.round((h - hours) * 60);
  
  // [CORRECTION] Empêcher l'affichage de "24:00"
  if (minutes === 60) {
    hours = (hours + 1) % 24; // Le modulo 24 ramène "24" à "0"
    minutes = 0;
  }
  
  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

// ============================================================
// HIJRI DATE CONVERSION
// ============================================================
function toHijri(date) {
  const Y = date.getFullYear();
  const M = date.getMonth() + 1;
  const D = date.getDate();
  const JD = julianDay(Y, M, D) + 0.5;
  const Z = Math.floor(JD);
  const L = Z - 1948440 + 10632;
  const N = Math.floor((L - 1) / 10631);
  const L2 = L - 10631 * N + 354;
  const J = Math.floor((10985 - L2) / 5316) * Math.floor((50 * L2) / 17719)
          + Math.floor(L2 / 5670) * Math.floor((43 * L2) / 15238);
  const L3 = L2 - Math.floor((30 - J) / 15) * Math.floor((17719 * J) / 50)
           - Math.floor(J / 16) * Math.floor((15238 * J) / 43) + 29;
  const month = Math.floor((24 * L3) / 709);
  const day = L3 - Math.floor((709 * month) / 24);
  const year = 30 * N + J - 30;

  const hijriMonths = [
    'Muharram','Safar','Rabi al-Awwal','Rabi al-Thani',
    'Jumada al-Ula','Jumada al-Akhira','Rajab','Sha\'ban',
    'Ramadan','Shawwal','Dhul Qi\'dah','Dhul Hijjah'
  ];
  return `${day} ${hijriMonths[month - 1]} ${year} H`;
}

const themeToggle = document.getElementById('themeToggle');

// Charger le thème sauvegardé ou utiliser le préférence système
function loadTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved ? saved === 'dark' : prefersDark;
  
  if (isDark) {
    bodyEl.classList.remove('light-theme');
    themeToggle.textContent = '🌙';
  } else {
    bodyEl.classList.add('light-theme');
    themeToggle.textContent = '☀️';
  }
}

themeToggle.addEventListener('click', () => {
  const isLight = bodyEl.classList.toggle('light-theme');
  themeToggle.textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
});

// ============================================================
// RENDER PRAYERS
// ============================================================
const PRAYERS = [
  { key: 'Fajr',    nameFr: 'Fajr',    nameAr: 'الفجر',   icon: '🌙' },
  { key: 'Sunrise', nameFr: 'Chourouk', nameAr: 'الشروق',  icon: '🌅' },
  { key: 'Dhuhr',   nameFr: 'Dhuhr',   nameAr: 'الظهر',   icon: '☀️' },
  { key: 'Asr',     nameFr: 'Asr',     nameAr: 'العصر',   icon: '🌤️' },
  { key: 'Maghrib', nameFr: 'Maghrib', nameAr: 'المغرب',  icon: '🌆' },
  { key: 'Isha',    nameFr: 'Isha',    nameAr: 'العشاء',  icon: '🌃' },
];

function timeStringToMinutes(ts) {
  if (ts === '--:--') return -1;
  const [h, m] = ts.split(':').map(Number);
  return h * 60 + m;
}

function renderPrayers(times, locName, lat, lng) {
  if (timerInterval) clearInterval(timerInterval);

  function getHTML() {
    const now = new Date();
    const isToday = (
      currentDate.getFullYear() === now.getFullYear() &&
      currentDate.getMonth() === now.getMonth() &&
      currentDate.getDate() === now.getDate()
    );
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    // Find next prayer
    const prayerTimes = PRAYERS.map(p => ({
      ...p,
      timeStr: decimalToTime(times[p.key]),
      minutes: timeStringToMinutes(decimalToTime(times[p.key]))
    }));

    // Current/next prayer for today
    let currentIdx = -1;
    let nextIdx = -1;
    
    if (isToday) {
      for (let i = prayerTimes.length - 1; i >= 0; i--) {
        if (prayerTimes[i].minutes !== -1 && nowMinutes >= prayerTimes[i].minutes) {
          currentIdx = i;
          break;
        }
      }
      // Next prayer
      for (let i = 0; i < prayerTimes.length; i++) {
        if (prayerTimes[i].minutes !== -1 && prayerTimes[i].minutes > nowMinutes) {
          nextIdx = i;
          break;
        }
      }
    }

    function getRemainingText(idx) {
      if (!isToday || idx < 0) return '';
      const pt = prayerTimes[idx];
      if (pt.minutes === -1) return '';
      const diff = pt.minutes - nowMinutes;
      if (diff <= 0) return 'En cours';
      const h = Math.floor(diff / 60);
      const m = diff % 60;
      if (h === 0) return `dans ${m} min`;
      return `dans ${h}h${String(m).padStart(2,'0')}`;
    }

    const cards = prayerTimes.map((p, i) => {
      const isCurrent = isToday && i === currentIdx;
      const isNext = isToday && i === nextIdx;
      const remaining = isNext ? getRemainingText(nextIdx) : (isCurrent ? 'En cours' : '');
      const nextBadge = isNext ? `<span class="next-badge">Suivante</span>` : '';
      return `
        <div class="prayer-card ${isCurrent ? 'current' : ''}">
          <div class="prayer-left">
            <div class="prayer-index">0${i+1}</div>
            <div class="prayer-icon">${p.icon}</div>
            <div class="prayer-names">
              <div class="prayer-name-fr">${p.nameFr}${nextBadge}</div>
              <div class="prayer-name-ar">${p.nameAr}</div>
            </div>
          </div>
          <div class="prayer-right">
            <div class="prayer-time">${p.timeStr}</div>
            ${remaining ? `<div class="prayer-remaining">${remaining}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    const coordStr = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'O'}`;

    return `
      <div class="location-info">
        <div class="location-name">${locName}</div>
        <div class="location-coords">LAT: ${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'} // LNG: ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'O'}</div>
      </div>
      <div class="prayers-grid">${cards}</div>
      <div class="method-badge">
        SYS.INFO: MWL PROTOCOL | FAJR 18° | ISHA 17° | ASR: SHAFI'I
      </div>`;
  }

  results.innerHTML = getHTML();
  
  if (isMonthViewActive) {
      renderMonthTable(lat, lng, locName);
  }

  // Update every minute
  timerInterval = setInterval(() => {
    results.innerHTML = getHTML();
  }, 30000);
}

// ============================================================
// RENDER MONTH TABLE
// ============================================================
function renderMonthTable(lat, lng, locName) {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
    
    let tableHTML = `
        <h3 style="margin-bottom: 15px; text-align:center;">
          HORAIRES DES PRIÈRES - ${currentDate.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'}).toUpperCase()}<br>
          <span style="font-size: 0.7em; color: var(--text-dim); text-transform: uppercase;">${locName}</span>
        </h3>
        <table class="month-table">
            <thead>
                <tr>
                    <th>JOUR</th>
                    <th>FAJR</th>
                    <th>CHOUROUK</th>
                    <th>DHUHR</th>
                    <th>ASR</th>
                    <th>MAGHRIB</th>
                    <th>ISHA</th>
                </tr>
            </thead>
            <tbody>
    `;

    for (let i = 1; i <= daysInMonth; i++) {
        const d = new Date(year, month, i);
        const dynamicTzOffset = d.getTimezoneOffset() / -60;
        const times = calcPrayerTimes(d, lat, lng, dynamicTzOffset);
        
        const isTodayRow = isCurrentMonth && today.getDate() === i;
        
        if (times) {
            tableHTML += `
                <tr class="${isTodayRow ? 'today-row' : ''}">
                    <td>${i}</td>
                    <td>${decimalToTime(times.Fajr)}</td>
                    <td>${decimalToTime(times.Sunrise)}</td>
                    <td>${decimalToTime(times.Dhuhr)}</td>
                    <td>${decimalToTime(times.Asr)}</td>
                    <td>${decimalToTime(times.Maghrib)}</td>
                    <td>${decimalToTime(times.Isha)}</td>
                </tr>
            `;
        }
    }
    
    tableHTML += `</tbody></table>`;
    monthTableContainer.innerHTML = tableHTML;
}

monthBtn.addEventListener('click', () => {
    isMonthViewActive = !isMonthViewActive;
    if (isMonthViewActive) {
        monthTableContainer.style.display = 'block';
        printBtn.style.display = 'inline-block';
        monthBtn.textContent = "MASQUER CALENDRIER MENSUEL";
        monthBtn.classList.add('btn-active');

            renderMonthTable(currentLocation.lat, currentLocation.lng, currentLocation.name);
        }
    } else {
        monthTableContainer.style.display = 'none';
        printBtn.style.display = 'none';

        monthBtn.classList.remove('btn-active');
    }
});

printBtn.addEventListener('click', () => {
    window.print();
});

function compute(lat, lng, tzOffset_ignored, locName) {
  // [CORRECTION] Calcul dynamique du fuseau horaire (Heure d'été/hiver)
  // On ignore le tzOffset passé en paramètre (qui vient souvent d'une BDD fixe)
  // et on récupère le décalage actuel exact sur la machine de l'utilisateur.
  const dynamicTzOffset = currentDate.getTimezoneOffset() / -60;
  
  const times = calcPrayerTimes(currentDate, lat, lng, dynamicTzOffset);
  
  if (!times) {
    showError('Impossible de calculer les horaires pour cette localisation.');
    return;
  }
  renderPrayers(times, locName, lat, lng);
}

// ============================================================
// AUTOCOMPLETE & DATE NAVIGATION
// ============================================================
function filterCities(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return CITIES.filter(c => {
    const name = c.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const country = c.country.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return name.startsWith(q) || country.startsWith(q);
  }).slice(0, 8);
}

cityInput.addEventListener('input', () => {
  const matches = filterCities(cityInput.value);
  if (matches.length === 0) {
    autocomplete.classList.remove('show');
    return;
  }
  autocomplete.innerHTML = matches.map(c => `
    <div class="autocomplete-item" data-name="${c.name}" data-country="${c.country}" data-lat="${c.lat}" data-lng="${c.lng}" data-tz="${c.tz}">
      <div>${c.name}</div>
      <div class="city-country">${c.country}</div>
    </div>`).join('');
  autocomplete.classList.add('show');
});

autocomplete.addEventListener('click', (e) => {
  const item = e.target.closest('.autocomplete-item');
  if (!item) return;
  const { name, country, lat, lng, tz } = item.dataset;
  cityInput.value = name;
  autocomplete.classList.remove('show');
  currentLocation = { name: `${name}, ${country}`, lat: +lat, lng: +lng, tz: +tz };
  compute(+lat, +lng, +tz, `${name}, ${country}`);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) {
    autocomplete.classList.remove('show');
  }
});

cityInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchBtn.click();
});

searchBtn.addEventListener('click', () => {
  const q = cityInput.value.trim();
  if (!q) { showError('Veuillez saisir le nom d\'une ville.'); return; }
  const matches = filterCities(q);
  if (matches.length === 0) {
    showError('Ville non trouvée. Essayez une autre orthographe ou choisissez dans la liste.');
    return;
  }
  const c = matches[0];
  currentLocation = { name: `${c.name}, ${c.country}`, lat: c.lat, lng: c.lng, tz: c.tz };
  cityInput.value = c.name;
  autocomplete.classList.remove('show');
  compute(c.lat, c.lng, c.tz, `${c.name}, ${c.country}`);
});

// Navigate days
prevDay.addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() - 1);
  updateDateDisplay();
  if (currentLocation) {
    compute(currentLocation.lat, currentLocation.lng, currentLocation.tz, currentLocation.name);
  }
});

nextDay.addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() + 1);
  updateDateDisplay();
  if (currentLocation) {
    compute(currentLocation.lat, currentLocation.lng, currentLocation.tz, currentLocation.name);
  }
});

// ============================================================
// GEOLOCATION
// ============================================================
geoBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    showError('La géolocalisation n\'est pas supportée par votre navigateur.');
    return;
  }
  showLoading(true);
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      let locName = `${lat.toFixed(4)}° N, ${Math.abs(lng).toFixed(4)}°`;
      
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=fr`);
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.municipality || '';
        const country = data.address?.country || '';
        if (city) locName = country ? `${city}, ${country}` : city;
      } catch(e) {
        console.warn('Erreur lors du reverse geocoding, utilisation des coordonnées.');
      }
      
      showLoading(false);
      currentLocation = { name: locName, lat, lng, tz: 0 }; // tz ignoré avec la correction
      cityInput.value = locName;
      compute(lat, lng, 0, locName);
    },
    (err) => {
      showLoading(false);
      showError('Erreur de géolocalisation. Veuillez vérifier vos permissions.');
    }
  );
});
