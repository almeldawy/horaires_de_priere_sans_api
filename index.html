<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horaires des Prières — Ligue Islamique Mondiale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --bg-color: #0f172a;
    --surface: #1e293b;
    --surface-hover: #334155;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
    --border: #334155;
    --font-main: 'Inter', system-ui, -apple-system, sans-serif;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
    --radius-md: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --card-current: rgba(59, 130, 246, 0.15);
    --card-current-border: #3b82f6;
    --neon-yellow: var(--primary);
  }

  body.light-theme {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-color: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --text-main: #0f172a;
    --text-dim: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --card-current: #eff6ff;
    --card-current-border: #bfdbfe;
    --neon-yellow: var(--primary);
  }

  body {
    background: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-main);
    min-height: 100vh;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  header { text-align: center; margin-bottom: 40px; }

  .arabic-bismillah {
    font-family: 'Amiri', serif;
    font-size: 1.8rem;
    color: var(--text-main);
    margin-bottom: 15px;
  }

  h1 {
    font-family: var(--font-main);
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--text-main);
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.2;
  }
  h1 span { color: var(--primary); }

  .subtitle {
    margin-top: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-dim);
    display: inline-block;
  }

  .ornament { display: none; }

  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 30px;
    margin-bottom: 30px;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }

  .search-row { display: flex; gap: 15px; align-items: stretch; }
  .search-wrapper { flex: 1; position: relative; }

  input[type="text"] {
    width: 100%;
    background: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-main);
    font-family: var(--font-main);
    font-size: 1rem;
    padding: 14px 20px;
    outline: none;
    transition: all 0.2s;
    box-sizing: border-box;
  }
  input[type="text"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
  input[type="text"]::placeholder { color: var(--text-dim); }

  .search-icon { display: none; }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-main);
    font-family: var(--font-main);
    font-weight: 500;
    font-size: 0.95rem;
    padding: 0 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:hover { background: var(--surface-hover); }

  .btn-search { background: var(--primary); color: white; border: none; }
  .btn-search:hover { background: var(--primary-hover); }

  .btn-active {
    background: var(--primary) !important;
    color: #ffffff !important;
    border-color: var(--primary) !important;
  }

  .action-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 24px;
    padding: 16px;
    background: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }

  .date-display { font-weight: 600; font-size: 1.1rem; text-align: center; }

  .date-hijri {
    display: block;
    color: var(--primary);
    font-weight: 400;
    font-size: 0.9rem;
    margin-top: 4px;
  }

  .btn-nav {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-main);
    width: 40px; height: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-size: 1.2rem;
  }
  .btn-nav:hover { background: var(--surface-hover); }

  .location-info {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .location-name { font-weight: 600; font-size: 1.4rem; color: var(--text-main); }
  .location-coords { color: var(--text-dim); font-size: 0.9rem; margin-top: 6px; }

  .prayers-grid { display: grid; gap: 16px; }

  .prayer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
  }
  .prayer-card:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .prayer-card.current {
    background: var(--card-current);
    border-color: var(--card-current-border);
  }

  .prayer-left { display: flex; align-items: center; gap: 20px; }
  .prayer-index { color: var(--text-dim); font-size: 0.85rem; font-weight: 600; }
  .prayer-icon { font-size: 1.6rem; }
  .prayer-names { display: flex; flex-direction: column; }
  .prayer-name-fr { font-weight: 600; font-size: 1.1rem; color: var(--text-main); }
  .prayer-card.current .prayer-name-fr { color: var(--primary); }
  .prayer-name-ar {
    font-family: 'Amiri', serif;
    color: var(--text-dim);
    font-size: 1.1rem;
    margin-top: 2px;
  }

  .prayer-right { text-align: right; }
  .prayer-time { font-weight: 700; font-size: 2rem; letter-spacing: -0.02em; }
  .prayer-card.current .prayer-time { color: var(--primary); }
  .prayer-remaining { color: var(--primary); font-size: 0.85rem; font-weight: 500; margin-top: 4px; }

  .method-badge {
    margin-top: 24px;
    padding: 16px;
    border-radius: var(--radius-md);
    background: var(--surface);
    border: 1px solid var(--border);
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .next-badge {
    background: var(--primary);
    color: white;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 0.7rem;
    margin-left: 10px;
    vertical-align: middle;
    font-weight: 600;
  }

  #monthTableContainer {
    display: none;
    margin-top: 30px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }
  #monthTableContainer h3 {
    color: var(--text-main) !important;
    font-family: var(--font-main) !important;
    font-weight: 600;
  }

  .month-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .month-table th, .month-table td {
    border-bottom: 1px solid var(--border);
    padding: 14px;
    text-align: center;
    font-size: 0.95rem;
  }
  .month-table th { background: var(--bg-color); font-weight: 600; color: var(--text-main); }
  .month-table tr:last-child td { border-bottom: none; }
  .month-table tr:hover td { background: var(--surface-hover); }
  .month-table tr.today-row td {
    background: var(--card-current);
    color: var(--primary);
    font-weight: 600;
  }

  .theme-toggle {
    display: flex;
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-main);
    font-size: 1.4rem;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-md);
    z-index: 1000;
    transition: all 0.2s ease;
  }
  .theme-toggle:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  .autocomplete-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 100;
    margin-top: 4px;
    overflow: hidden;
    display: none;
  }
  .autocomplete-list.show { display: block; }

  .autocomplete-item {
    padding: 12px 20px;
    color: var(--text-main);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover { background: var(--surface-hover); }
  .autocomplete-item .city-country { color: var(--text-dim); font-size: 0.85rem; margin-top: 2px; }

  .error-msg {
    background: #fee2e2;
    color: #991b1b;
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 24px;
    text-align: center;
    display: none;
    font-weight: 500;
  }

  .placeholder-state {
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border);
    padding: 40px;
    text-align: center;
    color: var(--text-dim);
  }
  .placeholder-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .placeholder-title { font-weight: 600; font-size: 1.1rem; color: var(--text-main); }
  .placeholder-sub { font-size: 0.9rem; margin-top: 4px; }

  .loading { display: none; text-align: center; margin-bottom: 20px; }
  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid var(--border);
    border-top: 3px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .btn-print { display: none; }

  @media print {
    @page { size: A4 portrait; margin: 1.5cm; }
    body { background: #fff !important; color: #000 !important; }
    .theme-toggle, header, .search-section, .location-info, .prayers-grid, .method-badge { display: none !important; }
    .container { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
    #monthTableContainer { display: block !important; margin-top: 0 !important; box-shadow: none !important; }
    #monthTableContainer h3 { color: #000 !important; text-align: center; font-size: 16pt; margin-bottom: 20px !important; }
    .month-table { width: 100% !important; border: 1px solid #000 !important; border-collapse: collapse !important; }
    .month-table th, .month-table td { border: 1px solid #000 !important; padding: 6px 2px !important; color: #000 !important; font-size: 10pt !important; }
    .month-table th { background: #f0f0f0 !important; font-weight: bold; }
    .month-table tr.today-row td { font-weight: bold !important; background: #e0e0e0 !important; }
  }

  @media (max-width: 768px) {
    .container { padding: 20px 16px; }
    .search-section { padding: 20px; }
    .search-row { flex-direction: column; gap: 12px; }
    .btn { padding: 14px; width: 100%; justify-content: center; }
    .action-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .date-nav { padding: 12px; gap: 10px; }
    .date-display { font-size: 1rem; }
    .prayer-card { padding: 16px 20px; }
    .prayer-left { gap: 15px; }
    .prayer-time { font-size: 1.6rem; }
    .prayer-name-fr { font-size: 1rem; }
    h1 { font-size: clamp(1.8rem, 8vw, 2.5rem); }
    .location-info { padding: 16px; }
    .theme-toggle { bottom: 20px; right: 20px; width: 44px; height: 44px; font-size: 1.2rem; }
  }
</style>

<div class="container">
  <header>

  <div id="monthTableContainer"></div>
</div>
<script src="communes.js"></script>
<script>
// ============================================================
// BASE DE VILLES (communes.js) — fallback vide si absent
// Format attendu : { name, country, lat, lng, tz }
//   tz = décalage UTC "hiver" (ex. 1 pour la France) OU nom IANA ("Europe/Paris")
// ============================================================
const CITIES = typeof communesFrance !== 'undefined' ? communesFrance : [];

// ============================================================
// CALCUL DES HORAIRES — MUSLIM WORLD LEAGUE (MWL)
// Fajr 18° | Isha 17° | Asr Shafi'i (ombre x1)
// ============================================================
const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;
const MWL_FAJR_ANGLE = 18.0;
const MWL_ISHA_ANGLE = 17.0;
const ASR_SHADOW_FACTOR = 1; // 2 pour Hanafi

function normDeg(x) { x %= 360; return x < 0 ? x + 360 : x; }

function julianDay(Y, M, D) {
  if (M <= 2) { Y--; M += 12; }
  const A = Math.floor(Y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + D + B - 1524.5;
}

function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = normDeg(357.529 + 0.98560028 * D);   // anomalie moyenne
  const q = normDeg(280.459 + 0.98564736 * D);   // longitude moyenne
  const L = normDeg(q + 1.915 * Math.sin(g * DEG) + 0.020 * Math.sin(2 * g * DEG));
  const e = 23.439 - 0.00000036 * D;             // obliquité

  let RA = Math.atan2(Math.cos(e * DEG) * Math.sin(L * DEG), Math.cos(L * DEG)) * RAD / 15;
  if (RA < 0) RA += 24;

  const decl = Math.asin(Math.sin(e * DEG) * Math.sin(L * DEG)) * RAD;

  // Équation du temps (heures), ramenée dans [-12 ; 12]
  let EqT = q / 15 - RA;
  while (EqT > 12) EqT -= 24;
  while (EqT < -12) EqT += 24;

  return { decl, EqT };
}

function hourAngle(angle, lat, decl) {
  const cosH = (Math.sin(angle * DEG) - Math.sin(lat * DEG) * Math.sin(decl * DEG))
             / (Math.cos(lat * DEG) * Math.cos(decl * DEG));
  if (cosH > 1 || cosH < -1) return null; // angle jamais atteint
  return Math.acos(cosH) * RAD / 15;
}

function asrHourAngle(lat, decl, shadowFactor) {
  const angle = Math.atan(1 / (shadowFactor + Math.tan(Math.abs(lat - decl) * DEG))) * RAD;
  return hourAngle(angle, lat, decl);
}

function calcPrayerTimes(date, lat, lng, tzOffset) {
  // Déclinaison / équation du temps évaluées au midi solaire local (et non à 0h UTC)
  const jd = julianDay(date.getFullYear(), date.getMonth() + 1, date.getDate()) + 0.5 - lng / 360;
  const { decl, EqT } = sunPosition(jd);

  const Dhuhr = 12 + tzOffset - lng / 15 - EqT;

  const sunH = hourAngle(-0.8333, lat, decl);
  if (sunH === null) return null; // soleil de minuit / nuit polaire

  const Sunrise = Dhuhr - sunH;
  const Sunset  = Dhuhr + sunH;

  // Fajr et Isha calculés séparément, durée plafonnée à 1/7 de la nuit
  // (évite les sauts brusques en été aux latitudes élevées)
  const night = (Sunrise + 24) - Sunset;
  const cap = night / 7;
  const fajrH = hourAngle(-MWL_FAJR_ANGLE, lat, decl);
  const ishaH = hourAngle(-MWL_ISHA_ANGLE, lat, decl);

  const fajrDelta = fajrH === null ? Infinity : Sunrise - (Dhuhr - fajrH);
  const ishaDelta = ishaH === null ? Infinity : (Dhuhr + ishaH) - Sunset;

  const Fajr = Sunrise - Math.min(fajrDelta, cap);
  const Isha = Sunset + Math.min(ishaDelta, cap);

  const asrH = asrHourAngle(lat, decl, ASR_SHADOW_FACTOR);
  const Asr = asrH !== null ? Dhuhr + asrH : null;

  return { Fajr, Sunrise, Dhuhr, Asr, Maghrib: Sunset, Isha };
}

function decimalToTime(decimal) {
  if (decimal === null || decimal === undefined || isNaN(decimal)) return '--:--';
  // On arrondit en minutes totales d'abord : évite "13:60" et "24:00"
  let total = Math.round(decimal * 60);
  total = ((total % 1440) + 1440) % 1440;
  const hours = Math.floor(total / 60);
  const minutes = total % 60;
  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

// ============================================================
// FUSEAU HORAIRE & HEURE D'ÉTÉ (indépendants du navigateur)
// ============================================================
function tzOffsetFromIana(date, tzName) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12));
  const o = {};
  new Intl.DateTimeFormat('en-US', {
    timeZone: tzName, hourCycle: 'h23',
    year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: 'numeric', second: 'numeric'
  }).formatToParts(d).forEach(p => { o[p.type] = +p.value; });
  return (Date.UTC(o.year, o.month - 1, o.day, o.hour, o.minute, o.second) - d.getTime()) / 3600000;
}

function lastSundayUTC(year, monthIdx) {
  const d = new Date(Date.UTC(year, monthIdx + 1, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d.getTime();
}

// Heure d'été UE : dernier dimanche de mars 01:00 UTC → dernier dimanche d'octobre 01:00 UTC
function isEuDst(date) {
  const y = date.getFullYear();
  const start = lastSundayUTC(y, 2) + 3600000;
  const end = lastSundayUTC(y, 9) + 3600000;
  const t = Date.UTC(y, date.getMonth(), date.getDate(), 12);
  return t >= start && t < end;
}

function getTzOffset(date, loc) {
  if (loc.tzName) {
    try { return tzOffsetFromIana(date, loc.tzName); } catch (e) { /* repli ci-dessous */ }
  }
  let base = Number(loc.tz);
  if (isNaN(base)) base = Math.round(loc.lng / 15);
  const inEurope = loc.lat >= 34 && loc.lng > -25 && loc.lng < 45;
  if (inEurope && base >= 0 && base <= 2) return base + (isEuDst(date) ? 1 : 0);
  return base;
}

// ============================================================
// DATE HIJRI
// ============================================================
function toHijriFallback(date) {
  const JD = julianDay(date.getFullYear(), date.getMonth() + 1, date.getDate()) + 0.5;
  const Z = Math.floor(JD);
  const L = Z - 1948440 + 10632;
  const N = Math.floor((L - 1) / 10631);
  const L2 = L - 10631 * N + 354;
  const J = Math.floor((10985 - L2) / 5316) * Math.floor((50 * L2) / 17719)
          + Math.floor(L2 / 5670) * Math.floor((43 * L2) / 15238);
  const L3 = L2 - Math.floor((30 - J) / 15) * Math.floor((17719 * J) / 50)
           - Math.floor(J / 16) * Math.floor((15238 * J) / 43) + 29;
  const month = Math.floor((24 * L3) / 709);
  const day = L3 - Math.floor((709 * month) / 24);
  const year = 30 * N + J - 30;
  const names = ['Muharram','Safar','Rabi al-Awwal','Rabi al-Thani','Jumada al-Ula','Jumada al-Akhira',
                 'Rajab','Sha\'ban','Ramadan','Shawwal','Dhul Qi\'dah','Dhul Hijjah'];
  return `${day} ${names[month - 1]} ${year} H`;
}

function toHijri(date) {
  try {
    const s = new Intl.DateTimeFormat('fr-FR-u-ca-islamic-umalqura', {
      day: 'numeric', month: 'long', year: 'numeric'
    }).format(date);
    if (/\d/.test(s)) return s.replace(/\s*(AH|ap\. J\.-C\.)\s*$/i, '') + ' H';
  } catch (e) { /* repli */ }
  return toHijriFallback(date);
}

// ============================================================
// UTILITAIRES UI
// ============================================================
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let currentDate = new Date();
currentDate.setHours(12, 0, 0, 0); // midi : évite tout souci de changement d'heure
let currentLocation = null;
let timerInterval = null;
let errorTimeout = null;

const cityInput    = document.getElementById('cityInput');
const autocomplete = document.getElementById('autocompleteList');
const geoBtn       = document.getElementById('geoBtn');
const searchBtn    = document.getElementById('searchBtn');
const prevDay      = document.getElementById('prevDay');
const nextDay      = document.getElementById('nextDay');
const dateGreg     = document.getElementById('dateGreg');
const dateHijri    = document.getElementById('dateHijri');
const results      = document.getElementById('results');
const errorMsg     = document.getElementById('errorMsg');
const loadingEl    = document.getElementById('loadingEl');
const monthBtn     = document.getElementById('monthBtn');
const printBtn     = document.getElementById('printBtn');
const monthTableContainer = document.getElementById('monthTableContainer');

let isMonthViewActive = false;

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  clearTimeout(errorTimeout);
  errorTimeout = setTimeout(() => { errorMsg.style.display = 'none'; }, 4000);
}

function showLoading(show) { loadingEl.style.display = show ? 'block' : 'none'; }

function updateDateDisplay() {
  dateGreg.textContent = currentDate.toLocaleDateString('fr-FR',
    { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  dateHijri.textContent = toHijri(currentDate);
}
updateDateDisplay();

// ============================================================
// THÈME
// ============================================================
const themeToggle = document.getElementById('themeToggle');
const bodyEl = document.body;

function loadTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved ? saved === 'dark' : prefersDark;
  bodyEl.classList.toggle('light-theme', !isDark);
  themeToggle.textContent = isDark ? '🌙' : '☀️';
}

themeToggle.addEventListener('click', () => {
  const isLight = bodyEl.classList.toggle('light-theme');
  themeToggle.textContent = isLight ? '☀️' : '🌙';
  try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch (e) {}
});
loadTheme();

// ============================================================
// AFFICHAGE DES PRIÈRES
// ============================================================
const PRAYERS = [
  { key: 'Fajr',    nameFr: 'Fajr',     nameAr: 'الفجر',   icon: '🌙' },
  { key: 'Sunrise', nameFr: 'Chourouk', nameAr: 'الشروق',  icon: '🌅' },
  { key: 'Dhuhr',   nameFr: 'Dhuhr',    nameAr: 'الظهر',   icon: '☀️' },
  { key: 'Asr',     nameFr: 'Asr',      nameAr: 'العصر',   icon: '🌤️' },
  { key: 'Maghrib', nameFr: 'Maghrib',  nameAr: 'المغرب',  icon: '🌆' },
  { key: 'Isha',    nameFr: 'Isha',     nameAr: 'العشاء',  icon: '🌃' },
];

function fmtCoord(v, pos, neg) { return `${Math.abs(v).toFixed(4)}° ${v >= 0 ? pos : neg}`; }

function renderPrayers(times, loc) {
  if (timerInterval) clearInterval(timerInterval);

  function getHTML() {
    // "Maintenant" exprimé à l'heure LOCALE de la ville (pas celle du navigateur)
    const offset = getTzOffset(currentDate, loc);
    const nowLoc = new Date(Date.now() + offset * 3600000);
    const isToday = nowLoc.getUTCFullYear() === currentDate.getFullYear()
                 && nowLoc.getUTCMonth() === currentDate.getMonth()
                 && nowLoc.getUTCDate() === currentDate.getDate();
    const nowMinutes = nowLoc.getUTCHours() * 60 + nowLoc.getUTCMinutes();

    // Minutes brutes (Isha peut dépasser 24h en été)
    const prayerTimes = PRAYERS.map(p => {
      const v = times[p.key];
      return {
        ...p,
        timeStr: decimalToTime(v),
        minutes: (v === null || isNaN(v)) ? -1 : Math.round(v * 60)
      };
    });

    let currentIdx = -1;
    let nextIdx = -1;

    if (isToday) {
      for (let i = prayerTimes.length - 1; i >= 0; i--) {
        if (prayerTimes[i].minutes !== -1 && nowMinutes >= prayerTimes[i].minutes) { currentIdx = i; break; }
      }
      for (let i = 0; i < prayerTimes.length; i++) {
        if (prayerTimes[i].minutes !== -1 && prayerTimes[i].minutes > nowMinutes) { nextIdx = i; break; }
      }
      // Avant Fajr (y compris après minuit) : c'est encore la nuit d'Isha
      if (currentIdx === -1) currentIdx = prayerTimes.length - 1;
    }

    function remainingText(idx) {
      const diff = prayerTimes[idx].minutes - nowMinutes;
      if (diff <= 0) return 'En cours';
      const h = Math.floor(diff / 60);
      const m = diff % 60;
      return h === 0 ? `dans ${m} min` : `dans ${h}h${String(m).padStart(2, '0')}`;
    }

    const cards = prayerTimes.map((p, i) => {
      const isCurrent = isToday && i === currentIdx;
      const isNext = isToday && i === nextIdx;
      const remaining = isNext ? remainingText(nextIdx) : (isCurrent ? 'En cours' : '');
      const nextBadge = isNext ? `<span class="next-badge">Suivante</span>` : '';
      return `
        <div class="prayer-card ${isCurrent ? 'current' : ''}">
          <div class="prayer-left">
            <div class="prayer-index">0${i + 1}</div>
            <div class="prayer-icon">${p.icon}</div>
            <div class="prayer-names">
              <div class="prayer-name-fr">${p.nameFr}${nextBadge}</div>
              <div class="prayer-name-ar">${p.nameAr}</div>
            </div>
          </div>
          <div class="prayer-right">
            <div class="prayer-time">${p.timeStr}</div>
            ${remaining ? `<div class="prayer-remaining">${remaining}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    const utcLabel = `UTC${offset >= 0 ? '+' : '−'}${Math.abs(offset)}`;

    return `
      <div class="location-info">
        <div class="location-name">${esc(loc.name)}</div>
        <div class="location-coords">${fmtCoord(loc.lat, 'N', 'S')} · ${fmtCoord(loc.lng, 'E', 'O')} · ${utcLabel}</div>
      </div>
      <div class="prayers-grid">${cards}</div>
      <div class="method-badge">
        MWL · Fajr 18° · Isha 17° · Asr ${ASR_SHADOW_FACTOR === 1 ? "Shafi'i" : 'Hanafi'}
      </div>`;
  }

  results.innerHTML = getHTML();
  if (isMonthViewActive) renderMonthTable(loc);

  timerInterval = setInterval(() => { results.innerHTML = getHTML(); }, 30000);
}

// ============================================================
// TABLEAU MENSUEL
// ============================================================
function renderMonthTable(loc) {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const nowLoc = new Date(Date.now() + getTzOffset(currentDate, loc) * 3600000);
  const isCurrentMonth = nowLoc.getUTCFullYear() === year && nowLoc.getUTCMonth() === month;
  const todayDate = nowLoc.getUTCDate();

  let html = `
    <h3 style="margin-bottom: 15px; text-align:center;">
      HORAIRES DES PRIÈRES — ${esc(currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }).toUpperCase())}<br>
      <span style="font-size: 0.7em; color: var(--text-dim); text-transform: uppercase;">${esc(loc.name)}</span>
    </h3>
    <table class="month-table">
      <thead>
        <tr><th>JOUR</th><th>FAJR</th><th>CHOUROUK</th><th>DHUHR</th><th>ASR</th><th>MAGHRIB</th><th>ISHA</th></tr>
      </thead>
      <tbody>`;

  for (let i = 1; i <= daysInMonth; i++) {
    const d = new Date(year, month, i, 12);
    const times = calcPrayerTimes(d, loc.lat, loc.lng, getTzOffset(d, loc));
    const cls = (isCurrentMonth && todayDate === i) ? 'today-row' : '';
    if (times) {
      html += `<tr class="${cls}"><td>${i}</td>
        <td>${decimalToTime(times.Fajr)}</td><td>${decimalToTime(times.Sunrise)}</td>
        <td>${decimalToTime(times.Dhuhr)}</td><td>${decimalToTime(times.Asr)}</td>
        <td>${decimalToTime(times.Maghrib)}</td><td>${decimalToTime(times.Isha)}</td></tr>`;
    } else {
      html += `<tr class="${cls}"><td>${i}</td><td>--:--</td><td>--:--</td><td>--:--</td><td>--:--</td><td>--:--</td><td>--:--</td></tr>`;
    }
  }

  html += `</tbody></table>`;
  monthTableContainer.innerHTML = html;
}

monthBtn.addEventListener('click', () => {
  isMonthViewActive = !isMonthViewActive;
  if (isMonthViewActive) {
    monthTableContainer.style.display = 'block';
    printBtn.style.display = 'inline-flex';
    monthBtn.textContent = 'MASQUER LE CALENDRIER MENSUEL';
    monthBtn.classList.add('btn-active');
    if (currentLocation) renderMonthTable(currentLocation);
  } else {
    monthTableContainer.style.display = 'none';
    printBtn.style.display = 'none';
    monthBtn.textContent = 'AFFICHER LE CALENDRIER MENSUEL';
    monthBtn.classList.remove('btn-active');
  }
});

printBtn.addEventListener('click', () => window.print());

function compute(loc) {
  const times = calcPrayerTimes(currentDate, loc.lat, loc.lng, getTzOffset(currentDate, loc));
  if (!times) {
    showError('Impossible de calculer les horaires pour cette localisation à cette date.');
    return;
  }
  renderPrayers(times, loc);
}

// ============================================================
// AUTOCOMPLÉTION & NAVIGATION PAR DATE
// ============================================================
function stripAccents(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function filterCities(query) {
  if (!query || query.length < 2) return [];
  const q = stripAccents(query);
  return CITIES.filter(c => stripAccents(c.name).startsWith(q) || stripAccents(c.country || '').startsWith(q)).slice(0, 8);
}

function cityToLocation(c) {
  const loc = { name: `${c.name}, ${c.country}`, lat: +c.lat, lng: +c.lng, tz: c.tz };
  if (typeof c.tz === 'string' && isNaN(Number(c.tz))) loc.tzName = c.tz;
  return loc;
}

let lastMatches = [];

cityInput.addEventListener('input', () => {
  lastMatches = filterCities(cityInput.value);
  if (lastMatches.length === 0) { autocomplete.classList.remove('show'); return; }
  autocomplete.innerHTML = lastMatches.map((c, i) => `
    <div class="autocomplete-item" data-idx="${i}">
      <div>${esc(c.name)}</div>
      <div class="city-country">${esc(c.country)}</div>
    </div>`).join('');
  autocomplete.classList.add('show');
});

autocomplete.addEventListener('click', (e) => {
  const item = e.target.closest('.autocomplete-item');
  if (!item) return;
  const c = lastMatches[+item.dataset.idx];
  if (!c) return;
  cityInput.value = c.name;
  autocomplete.classList.remove('show');
  currentLocation = cityToLocation(c);
  compute(currentLocation);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) autocomplete.classList.remove('show');
});

cityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchBtn.click(); });

searchBtn.addEventListener('click', () => {
  const q = cityInput.value.trim();
  if (!q) { showError('Veuillez saisir le nom d\'une ville.'); return; }
  const matches = filterCities(q);
  if (matches.length === 0) {
    showError('Ville non trouvée. Essayez une autre orthographe ou choisissez dans la liste.');
    return;
  }
  const c = matches[0];
  cityInput.value = c.name;
  autocomplete.classList.remove('show');
  currentLocation = cityToLocation(c);
  compute(currentLocation);
});

function shiftDay(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  currentDate.setHours(12, 0, 0, 0);
  updateDateDisplay();
  if (currentLocation) compute(currentLocation);
}
prevDay.addEventListener('click', () => shiftDay(-1));
nextDay.addEventListener('click', () => shiftDay(1));

// ============================================================
// GÉOLOCALISATION
// ============================================================
geoBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    showError('La géolocalisation n\'est pas supportée par votre navigateur.');
    return;
  }
  showLoading(true);
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      let locName = `${fmtCoord(lat, 'N', 'S')}, ${fmtCoord(lng, 'E', 'O')}`;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=fr`);
        const data = await res.json();
        const a = data.address || {};
        const city = a.city || a.town || a.village || a.municipality || '';
        const country = a.country || '';
        if (city) locName = country ? `${city}, ${country}` : city;
      } catch (e) {
        console.warn('Reverse geocoding impossible, utilisation des coordonnées.');
      }

      showLoading(false);
      // Sur place : le fuseau du navigateur (nom IANA) gère correctement l'heure d'été
      const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
      currentLocation = { name: locName, lat, lng, tz: null, tzName };
      cityInput.value = locName;
      compute(currentLocation);
    },
    () => {
      showLoading(false);
      showError('Erreur de géolocalisation. Veuillez vérifier vos permissions.');
    }
  );
});
</script>
