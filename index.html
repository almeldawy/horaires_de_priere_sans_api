<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horaires des Prières — Ligue Islamique Mondiale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-pink: #ff2a6d;
    --neon-cyan: #05d9e8;
    --neon-blue: #0182cb;
    --neon-purple: #b12a5b;
    --neon-yellow: #f1c40f;
    --dark-bg: #050505;
    --dark-panel: #111;
    --grid-color: rgba(5, 217, 232, 0.15);
    --text-main: #e0e0e0;
    --text-dim: #888;
    --font-cyber: 'Orbitron', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }
  
  body.light-theme {
    /* Le thème clair est désactivé dans l'esthétique rétro-futuriste, on force le sombre stylisé */
    --neon-pink: #d90368;
    --neon-cyan: #00b4d8;
    --dark-bg: #e0e5ec;
    --dark-panel: #f0f5fa;
    --grid-color: rgba(0, 180, 216, 0.15);
    --text-main: #2b2d42;
    --text-dim: #6c757d;
  }
  
  body {
    background: var(--dark-bg);
    color: var(--text-main);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    position: relative;
    text-transform: uppercase;
  }

  /* Cyber Grid Background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 40px; }
  }

  /* Scanlines overlay */
  body::after {
    content: " ";
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 10;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 40px;
    position: relative;
  }
  
  .arabic-bismillah {
    font-family: 'Amiri', serif;
    font-size: 1.8rem;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan);
    margin-bottom: 15px;
    text-transform: none;
  }

  h1 {
    font-family: var(--font-cyber);
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 4rem);
    color: #fff;
    text-shadow: 
      0 0 5px #fff,
      0 0 10px #fff,
      0 0 20px var(--neon-pink),
      0 0 40px var(--neon-pink),
      0 0 80px var(--neon-pink);
    letter-spacing: 5px;
    margin: 0;
    line-height: 1.2;
    animation: flicker 4s infinite alternate;
  }
  
  h1 span {
    color: var(--neon-cyan);
    text-shadow: 
      0 0 5px #fff,
      0 0 10px #fff,
      0 0 20px var(--neon-cyan),
      0 0 40px var(--neon-cyan);
  }

  @keyframes flicker {
    0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
    20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; text-shadow: none; }
  }

  .subtitle {
    margin-top: 15px;
    font-size: 0.9rem;
    letter-spacing: 4px;
    color: var(--neon-cyan);
    border-bottom: 1px solid var(--neon-cyan);
    display: inline-block;
    padding-bottom: 5px;
    box-shadow: 0 1px 5px var(--neon-cyan);
  }

  /* SEARCH SECTION */
  .search-section {
    background: rgba(17, 17, 17, 0.85);
    border: 2px solid var(--neon-cyan);
    box-shadow: 
      inset 0 0 20px rgba(5, 217, 232, 0.2),
      0 0 20px rgba(5, 217, 232, 0.4);
    padding: 30px;
    margin-bottom: 30px;
    position: relative;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
  }

  /* Glitch decoration */
  .search-section::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple));
    z-index: -1;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    animation: borderGlitch 2s linear infinite;
    opacity: 0.5;
  }

  .search-row {
    display: flex;
    gap: 15px;
    align-items: stretch;
  }

  .search-wrapper {
    flex: 1;
    position: relative;
  }

  input[type="text"] {
    width: 100%;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-family: var(--font-mono);
    font-size: 1rem;
    padding: 15px 20px;
    outline: none;
    transition: all 0.3s;
    box-shadow: inset 0 0 10px rgba(5, 217, 232, 0.1);
  }

  input[type="text"]:focus {
    background: rgba(5, 217, 232, 0.1);
    box-shadow: 
      inset 0 0 15px rgba(5, 217, 232, 0.5),
      0 0 15px rgba(5, 217, 232, 0.5);
    border-color: #fff;
  }
  
  input[type="text"]::placeholder {
    color: rgba(5, 217, 232, 0.5);
  }

  .search-icon { display: none; } /* Caché pour un look plus épuré */

  /* Buttons */
  .btn {
    background: transparent;
    border: 2px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-family: var(--font-cyber);
    font-size: 0.9rem;
    letter-spacing: 2px;
    padding: 0 25px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    text-shadow: 0 0 5px var(--neon-cyan);
  }

  .btn:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 20px var(--neon-cyan);
    text-shadow: none;
  }

  .btn-search {
    background: rgba(255, 42, 109, 0.1);
    border-color: var(--neon-pink);
    color: var(--neon-pink);
    text-shadow: 0 0 5px var(--neon-pink);
  }
  
  .btn-search:hover {
    background: var(--neon-pink);
    color: #000;
    box-shadow: 0 0 20px var(--neon-pink);
  }

  /* Actions supplémentaires (Bouton Mois) */
  .action-row {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed var(--grid-color);
  }

  .btn-month {
    border-color: var(--neon-yellow);
    color: var(--neon-yellow);
    text-shadow: 0 0 5px var(--neon-yellow);
    padding: 10px 20px;
    font-size: 0.8rem;
  }
  
  .btn-month:hover {
    background: var(--neon-yellow);
    color: #000;
    box-shadow: 0 0 20px var(--neon-yellow);
  }

  /* Date nav */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--grid-color);
  }

  .date-display {
    font-family: var(--font-cyber);
    font-size: 1.1rem;
    color: #fff;
    text-shadow: 0 0 5px #fff;
    text-align: center;
    letter-spacing: 2px;
  }

  .date-hijri {
    display: block;
    font-family: var(--font-mono);
    color: var(--neon-purple);
    font-size: 0.9rem;
    margin-top: 5px;
    text-shadow: 0 0 5px var(--neon-purple);
  }

  .btn-nav {
    background: transparent;
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    width: 40px; height: 40px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
  }
  
  .btn-nav:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 10px var(--neon-cyan);
  }

  /* LOCATION INFO */
  .location-info {
    text-align: center;
    margin-bottom: 30px;
    padding: 20px;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(5, 217, 232, 0.05) 10px, rgba(5, 217, 232, 0.05) 20px);
    border-left: 4px solid var(--neon-pink);
    border-right: 4px solid var(--neon-cyan);
  }

  .location-name {
    font-family: var(--font-cyber);
    font-size: 1.5rem;
    color: #fff;
    letter-spacing: 3px;
    text-shadow: 0 0 8px #fff;
  }

  .location-coords {
    color: var(--neon-cyan);
    font-size: 0.9rem;
    margin-top: 5px;
    letter-spacing: 2px;
  }

  /* PRAYER CARDS */
  .prayers-grid {
    display: grid;
    gap: 15px;
  }

  .prayer-card {
    background: rgba(17, 17, 17, 0.7);
    border: 1px solid var(--grid-color);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
  }
  
  .prayer-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--grid-color);
    transition: all 0.3s;
  }

  .prayer-card:hover {
    border-color: var(--neon-cyan);
    box-shadow: inset 0 0 20px rgba(5, 217, 232, 0.1);
    transform: translateX(5px);
  }

  .prayer-card.current {
    background: rgba(255, 42, 109, 0.1);
    border-color: var(--neon-pink);
    box-shadow: 
      inset 0 0 20px rgba(255, 42, 109, 0.2),
      0 0 15px rgba(255, 42, 109, 0.3);
  }
  
  .prayer-card.current::after {
    background: var(--neon-pink);
    box-shadow: 0 0 10px var(--neon-pink);
  }

  .prayer-left { display: flex; align-items: center; gap: 20px; }
  
  .prayer-index {
    color: var(--text-dim);
    font-size: 0.8rem;
    letter-spacing: 2px;
    font-weight: bold;
  }

  .prayer-icon {
    font-size: 1.5rem;
    filter: grayscale(1) invert(1) sepia(1) hue-rotate(150deg) saturate(500%) brightness(1.5);
    /* Tentative de coloriser les emojis en cyan */
  }
  
  .prayer-card.current .prayer-icon {
    filter: grayscale(1) invert(1) sepia(1) hue-rotate(300deg) saturate(500%) brightness(1.5);
    /* Rose pour l'actuelle */
  }

  .prayer-names { display: flex; flex-direction: column; }
  
  .prayer-name-fr {
    font-family: var(--font-cyber);
    font-size: 1.2rem;
    color: var(--neon-cyan);
    letter-spacing: 2px;
    text-shadow: 0 0 5px rgba(5, 217, 232, 0.5);
  }
  
  .prayer-card.current .prayer-name-fr {
    color: var(--neon-pink);
    text-shadow: 0 0 10px var(--neon-pink);
  }

  .prayer-name-ar {
    font-family: 'Amiri', serif;
    color: var(--text-dim);
    font-size: 1rem;
    text-transform: none;
    margin-top: 4px;
  }

  .prayer-right { text-align: right; }

  .prayer-time {
    font-family: var(--font-cyber);
    font-size: 2.2rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    letter-spacing: 4px;
  }

  .prayer-card.current .prayer-time {
    color: #fff;
    text-shadow: 
      0 0 5px #fff,
      0 0 20px var(--neon-pink);
  }

  .prayer-remaining {
    color: var(--neon-yellow);
    font-size: 0.8rem;
    letter-spacing: 1px;
    margin-top: 5px;
    text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
    animation: pulseText 2s infinite;
  }

  @keyframes pulseText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Method info */
  .method-badge {
    margin-top: 30px;
    padding: 15px;
    border: 1px solid var(--grid-color);
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    letter-spacing: 2px;
    background: rgba(0,0,0,0.5);
  }

  /* Next badge */
  .next-badge {
    background: var(--neon-yellow);
    color: #000;
    padding: 2px 6px;
    font-size: 0.6rem;
    margin-left: 10px;
    vertical-align: middle;
    font-family: var(--font-mono);
    box-shadow: 0 0 5px var(--neon-yellow);
  }

  /* Table des horaires du mois (cachée par défaut) */
  #monthTableContainer {
    display: none;
    margin-top: 30px;
    animation: scanline 0.5s ease-out;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .month-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(17, 17, 17, 0.9);
    border: 1px solid var(--neon-cyan);
  }

  .month-table th, .month-table td {
    border: 1px solid var(--grid-color);
    padding: 10px;
    text-align: center;
    font-size: 0.85rem;
  }

  .month-table th {
    background: rgba(5, 217, 232, 0.1);
    color: var(--neon-cyan);
    font-family: var(--font-cyber);
    letter-spacing: 1px;
  }

  .month-table tr:hover td {
    background: rgba(255, 42, 109, 0.1);
    color: #fff;
  }
  
  .month-table tr.today-row td {
    background: rgba(255, 42, 109, 0.2);
    color: var(--neon-pink);
    font-weight: bold;
    border-color: var(--neon-pink);
  }

  /* Theme toggle - rendu plus discret dans ce thème */
  .theme-toggle {
    display: none; /* On le cache car le thème cyberpunk est purement sombre */
  }

  /* Autocomplete - Stylisation cyberpunk */
  .autocomplete-list {
    background: var(--dark-panel);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  
  .autocomplete-item {
    color: var(--text-main);
    border-bottom: 1px solid rgba(5, 217, 232, 0.2);
  }
  
  .autocomplete-item:hover {
    background: rgba(5, 217, 232, 0.2);
    color: #fff;
    padding-left: 20px; /* Petit effet de slide */
  }
  
  .autocomplete-item .city-country {
    color: var(--neon-cyan);
  }

  @keyframes scanline {
    0% { transform: scaleY(0); opacity: 0; }
    100% { transform: scaleY(1); opacity: 1; }
  }

  .btn-print {
    border-color: #fff;
    color: #fff;
    text-shadow: 0 0 5px #fff;
    padding: 10px 20px;
    font-size: 0.8rem;
    margin-left: 10px;
    display: none; /* Masqué par défaut */
  }
  
  .btn-print:hover {
    background: #fff;
    color: #000;
    box-shadow: 0 0 20px #fff;
  }

  @media print {
    @page {
      size: A4 portrait;
      margin: 1.5cm;
    }
    body {
      background: #fff !important;
      color: #000 !important;
    }
    /* Désactiver les effets visuels rétro-futuristes pour l'impression */
    body::before, body::after { display: none !important; }
    
    /* Masquer l'interface inutile sur papier */
    header, .search-section, .location-info, .prayers-grid, .method-badge, .theme-toggle {
      display: none !important;
    }
    
    .container {
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
    }
    
    /* Forcer l'affichage du tableau et styliser pour économiser l'encre */
    #monthTableContainer {
      display: block !important;
      animation: none !important;
      margin-top: 0 !important;
    }
    
    #monthTableContainer h3 {
      color: #000 !important;
      text-shadow: none !important;
      text-align: center;
      font-size: 16pt;
      margin-bottom: 20px !important;
    }
    #monthTableContainer h3 span {
      color: #555 !important;
    }
    
    .month-table {
      width: 100% !important;
      border: 2px solid #000 !important;
      border-collapse: collapse !important;
    }
    
    .month-table th, .month-table td {
      border: 1px solid #000 !important;
      padding: 6px 2px !important;
      color: #000 !important;
      background: transparent !important;
      font-size: 10pt !important;
      font-family: sans-serif !important;
    }
    
    .month-table th {
      background: #f0f0f0 !important;
      font-weight: bold;
    }
    
    .month-table tr.today-row td {
      font-weight: bold !important;
      background: #e0e0e0 !important;
      border-color: #000 !important;
      color: #000 !important;
    }
  }

  /* ========================================================== */
  /* RESPONSIVE DESIGN (SMARTPHONES)                            */
  /* ========================================================== */
  @media (max-width: 768px) {
    .container {
      padding: 20px 10px;
    }
    
    .search-section {
      padding: 20px 15px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }
    .search-section::before {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }
    
    .search-row {
      flex-direction: column;
      gap: 15px;
    }
    
    .btn {
      padding: 15px;
    }
    
    .action-row {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    
    .btn-print {
      margin-left: 0;
    }
    
    .date-nav {
      padding: 10px 5px;
      gap: 8px;
    }
    
    .date-display {
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    
    .btn-nav {
      width: 35px;
      height: 35px;
    }
    
    .prayer-card {
      padding: 15px 12px;
    }
    
    .prayer-left {
      gap: 10px;
    }
    
    .prayer-time {
      font-size: 1.6rem;
      letter-spacing: 2px;
    }
    
    .prayer-name-fr {
      font-size: 1.1rem;
    }
    
    h1 {
      font-size: clamp(1.8rem, 8vw, 2.5rem);
      letter-spacing: 2px;
    }
    
    .location-info {
      padding: 15px 10px;
    }
    
    .location-name {
      font-size: 1.2rem;
      word-break: break-word;
    }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="Basculer le thème">🌙</button>
<div class="container">
  <header>
    <div class="arabic-bismillah">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line"></div>
    </div>
    <h1>Horaires des <span>Prières</span></h1>
    <p class="subtitle">Ligue Islamique Mondiale &nbsp;·&nbsp; Méthode MWL</p>
  </header>
  <div class="search-section">
    <div class="search-row">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="cityInput" placeholder="> RECHERCHER UNE VILLE_" autocomplete="off" />
        <div class="autocomplete-list" id="autocompleteList"></div>
      </div>
      <button class="btn btn-geo" id="geoBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="9" opacity="0.3"/>
        </svg>
        SYS.GEO
      </button>
      <button class="btn btn-search" id="searchBtn">EXECUTE</button>
    </div>
    
    <div class="action-row">
      <button class="btn btn-month" id="monthBtn">AFFICHER CALENDRIER MENSUEL</button>
      <button class="btn btn-print" id="printBtn">🖨️ IMPRIMER LE MOIS</button>
    </div>

    <div class="date-nav">
      <button class="btn-nav" id="prevDay">◀</button>
      <div class="date-display">
        <span id="dateGreg">—</span>
        <span class="date-hijri" id="dateHijri">—</span>
      </div>
      <button class="btn-nav" id="nextDay">▶</button>
    </div>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="loading" id="loadingEl">
    <div class="spinner"></div>
  </div>
  <div id="results">
    <div class="placeholder-state">
      <div class="placeholder-icon">📡</div>
      <div class="placeholder-title">EN ATTENTE DE DONNÉES LOCALES</div>
      <div class="placeholder-sub">VEUILLEZ INITIALISER UNE RECHERCHE</div>
    </div>
  </div>
  
  <div id="monthTableContainer">
    <!-- Le tableau mensuel sera injecté ici -->
  </div>
</div>
<script src="communes.js"></script>
<script>
// ============================================================
// CITIES DATABASE (latitude, longitude, timezone offset UTC)
// ============================================================

// ============================================================
// PRAYER TIME CALCULATION — MUSLIM WORLD LEAGUE (MWL)
// Fajr angle: 18°  |  Isha angle: 17°
// Asr: Hanafi (shadow = 2x) can be toggled, default Shafi'i (shadow = 1x)
// ============================================================
const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;
const MWL_FAJR_ANGLE = 18.0;
const MWL_ISHA_ANGLE  = 17.0;

function julianDay(Y, M, D) {
  if (M <= 2) { Y--; M += 12; }
  const A = Math.floor(Y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + D + B - 1524.5;
}

function sunPosition(jd) {
  const D = jd - 2451545.0;
  // Mean anomaly
  const g = (357.529 + 0.98560028 * D) % 360;
  // Mean longitude
  const q = (280.459 + 0.98564736 * D) % 360;
  // Ecliptic longitude
  const L = (q + 1.915 * Math.sin(g * DEG) + 0.020 * Math.sin(2 * g * DEG)) % 360;
  // Obliquity of ecliptic
  const e = 23.439 - 0.0000004 * D;
  // Right ascension (hours)
  let RA = Math.atan2(Math.cos(e * DEG) * Math.sin(L * DEG), Math.cos(L * DEG)) * RAD / 15;
  if (RA < 0) RA += 24;
  // Declination
  const decl = Math.asin(Math.sin(e * DEG) * Math.sin(L * DEG)) * RAD;
  
  // Équation du temps (heures)
  let EqT = (q / 15 - RA + 24) % 24;
  
  // [CORRECTION] Normaliser l'équation du temps autour de zéro
  // Empêche les décalages aberrants si l'écart calcule une valeur brute > 12h
  if (EqT > 12) {
    EqT -= 24; 
  }
  
  return { decl, EqT };
}

function hourAngle(angle, lat, decl) {
  const cosH = (Math.sin(angle * DEG) - Math.sin(lat * DEG) * Math.sin(decl * DEG)) 
             / (Math.cos(lat * DEG) * Math.cos(decl * DEG));
  if (Math.abs(cosH) > 1) return null; // never rises/sets
  return Math.acos(cosH) * RAD / 15;
}

function asrHourAngle(lat, decl, shadowFactor) {
  // Calcul de l'angle pour la prière de l'Asr
  // shadowFactor = 1 pour Shafi'i, 2 pour Hanafi
  const angle = Math.atan(1 / (shadowFactor + Math.tan(Math.abs(lat - decl) * DEG))) * RAD;
  return hourAngle(angle, lat, decl);
}

function calcPrayerTimes(date, lat, lng, tzOffset) {
  const Y = date.getFullYear();
  const M = date.getMonth() + 1;
  const D = date.getDate();
  const jd = julianDay(Y, M, D);

  const { decl, EqT } = sunPosition(jd);

  // Solar noon (local time)
  const Dhuhr = 12 + tzOffset - lng / 15 - EqT;

  // Sun zenith correction: -0.833° for sunrise/sunset (refraction + disc)
  const sunriseDuration = hourAngle(-0.8333, lat, decl);
  if (sunriseDuration === null) return null;

  const Sunrise = Dhuhr - sunriseDuration;
  const Sunset  = Dhuhr + sunriseDuration;

  let Fajr, Isha;
  const fajrH = hourAngle(-MWL_FAJR_ANGLE, lat, decl);
  const ishaH = hourAngle(-MWL_ISHA_ANGLE, lat, decl);

  // [CORRECTION] Gestion des latitudes élevées (Nuits blanches d'été)
  // Si le soleil ne descend jamais à 18° ou 17° sous l'horizon, hourAngle renvoie null.
  if (fajrH === null || ishaH === null) {
    // Calcul de la durée de la nuit (de Sunset à Sunrise le lendemain)
    let nightDuration = (Sunrise + 24) - Sunset; 
    
    // Méthode de repli : 1/7ème de la nuit
    const portion = nightDuration / 7; 
    
    Fajr = Sunrise - portion;
    Isha = Sunset + portion;
  } else {
    // Comportement normal
    Fajr = Dhuhr - fajrH;
    Isha = Dhuhr + ishaH;
  }

  // Asr: Shafi'i (shadow = 1x)
  const asrH = asrHourAngle(lat, decl, 1);
  const Asr = asrH !== null ? Dhuhr + asrH : null;
  
  // Maghrib = Sunset (standard)
  const Maghrib = Sunset;

  return { Fajr, Sunrise, Dhuhr, Asr, Maghrib, Isha };
}

function decimalToTime(decimal) {
  if (decimal === null || isNaN(decimal)) return '--:--';
  
  let h = decimal % 24;
  if (h < 0) h += 24;
  
  let hours = Math.floor(h);
  let minutes = Math.round((h - hours) * 60);
  
  // [CORRECTION] Empêcher l'affichage de "24:00"
  if (minutes === 60) {
    hours = (hours + 1) % 24; // Le modulo 24 ramène "24" à "0"
    minutes = 0;
  }
  
  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

// ============================================================
// HIJRI DATE CONVERSION
// ============================================================
function toHijri(date) {
  const Y = date.getFullYear();
  const M = date.getMonth() + 1;
  const D = date.getDate();
  const JD = julianDay(Y, M, D) + 0.5;
  const Z = Math.floor(JD);
  const L = Z - 1948440 + 10632;
  const N = Math.floor((L - 1) / 10631);
  const L2 = L - 10631 * N + 354;
  const J = Math.floor((10985 - L2) / 5316) * Math.floor((50 * L2) / 17719)
          + Math.floor(L2 / 5670) * Math.floor((43 * L2) / 15238);
  const L3 = L2 - Math.floor((30 - J) / 15) * Math.floor((17719 * J) / 50)
           - Math.floor(J / 16) * Math.floor((15238 * J) / 43) + 29;
  const month = Math.floor((24 * L3) / 709);
  const day = L3 - Math.floor((709 * month) / 24);
  const year = 30 * N + J - 30;

  const hijriMonths = [
    'Muharram','Safar','Rabi al-Awwal','Rabi al-Thani',
    'Jumada al-Ula','Jumada al-Akhira','Rajab','Sha\'ban',
    'Ramadan','Shawwal','Dhul Qi\'dah','Dhul Hijjah'
  ];
  return `${day} ${hijriMonths[month - 1]} ${year} H`;
}

}

}

// THEME TOGGLE

const themeToggle = document.getElementById('themeToggle');
const bodyEl = document.body;

// Charger le thème sauvegardé ou utiliser le préférence système
function loadTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved ? saved === 'dark' : prefersDark;
  
  if (isDark) {
    bodyEl.classList.remove('light-theme');
    themeToggle.textContent = '🌙';
  } else {
    bodyEl.classList.add('light-theme');
    themeToggle.textContent = '☀️';
  }
}

themeToggle.addEventListener('click', () => {
  const isLight = bodyEl.classList.toggle('light-theme');
  themeToggle.textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
});

// Forcer le thème sombre pour l'esthétique Cyberpunk

localStorage.setItem('theme', 'dark');

// ============================================================
// RENDER PRAYERS
// ============================================================
const PRAYERS = [
  { key: 'Fajr',    nameFr: 'Fajr',    nameAr: 'الفجر',   icon: '🌙' },
  { key: 'Sunrise', nameFr: 'Chourouk', nameAr: 'الشروق',  icon: '🌅' },
  { key: 'Dhuhr',   nameFr: 'Dhuhr',   nameAr: 'الظهر',   icon: '☀️' },
  { key: 'Asr',     nameFr: 'Asr',     nameAr: 'العصر',   icon: '🌤️' },
  { key: 'Maghrib', nameFr: 'Maghrib', nameAr: 'المغرب',  icon: '🌆' },
  { key: 'Isha',    nameFr: 'Isha',    nameAr: 'العشاء',  icon: '🌃' },
];

function timeStringToMinutes(ts) {
  if (ts === '--:--') return -1;
  const [h, m] = ts.split(':').map(Number);
  return h * 60 + m;
}

function renderPrayers(times, locName, lat, lng) {
  if (timerInterval) clearInterval(timerInterval);

  function getHTML() {
    const now = new Date();
    const isToday = (
      currentDate.getFullYear() === now.getFullYear() &&
      currentDate.getMonth() === now.getMonth() &&
      currentDate.getDate() === now.getDate()
    );
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    // Find next prayer
    const prayerTimes = PRAYERS.map(p => ({
      ...p,
      timeStr: decimalToTime(times[p.key]),
      minutes: timeStringToMinutes(decimalToTime(times[p.key]))
    }));

    // Current/next prayer for today
    let currentIdx = -1;
    let nextIdx = -1;
    
    if (isToday) {
      for (let i = prayerTimes.length - 1; i >= 0; i--) {
        if (prayerTimes[i].minutes !== -1 && nowMinutes >= prayerTimes[i].minutes) {
          currentIdx = i;
          break;
        }
      }
      // Next prayer
      for (let i = 0; i < prayerTimes.length; i++) {
        if (prayerTimes[i].minutes !== -1 && prayerTimes[i].minutes > nowMinutes) {
          nextIdx = i;
          break;
        }
      }
    }

    function getRemainingText(idx) {
      if (!isToday || idx < 0) return '';
      const pt = prayerTimes[idx];
      if (pt.minutes === -1) return '';
      const diff = pt.minutes - nowMinutes;
      if (diff <= 0) return 'En cours';
      const h = Math.floor(diff / 60);
      const m = diff % 60;
      if (h === 0) return `dans ${m} min`;
      return `dans ${h}h${String(m).padStart(2,'0')}`;
    }

    const cards = prayerTimes.map((p, i) => {
      const isCurrent = isToday && i === currentIdx;
      const isNext = isToday && i === nextIdx;
      const remaining = isNext ? getRemainingText(nextIdx) : (isCurrent ? 'En cours' : '');
      const nextBadge = isNext ? `<span class="next-badge">Suivante</span>` : '';
      return `
        <div class="prayer-card ${isCurrent ? 'current' : ''}">
          <div class="prayer-left">
            <div class="prayer-index">0${i+1}</div>
            <div class="prayer-icon">${p.icon}</div>
            <div class="prayer-names">
              <div class="prayer-name-fr">${p.nameFr}${nextBadge}</div>
              <div class="prayer-name-ar">${p.nameAr}</div>
            </div>
          </div>
          <div class="prayer-right">
            <div class="prayer-time">${p.timeStr}</div>
            ${remaining ? `<div class="prayer-remaining">${remaining}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    const coordStr = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'O'}`;

    return `
      <div class="location-info">
        <div class="location-name">${locName}</div>
        <div class="location-coords">LAT: ${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'} // LNG: ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'O'}</div>
      </div>
      <div class="prayers-grid">${cards}</div>
      <div class="method-badge">
        SYS.INFO: MWL PROTOCOL | FAJR 18° | ISHA 17° | ASR: SHAFI'I
      </div>`;
  }

  results.innerHTML = getHTML();
  
  if (isMonthViewActive) {
      renderMonthTable(lat, lng, locName);
  }

  // Update every minute
  timerInterval = setInterval(() => {
    results.innerHTML = getHTML();
  }, 30000);
}

// ============================================================
// RENDER MONTH TABLE
// ============================================================
function renderMonthTable(lat, lng, locName) {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
    
    let tableHTML = `
        <h3 style="color: var(--neon-cyan); font-family: var(--font-cyber); margin-bottom: 15px; text-align:center;">
          HORAIRES DES PRIÈRES - ${currentDate.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'}).toUpperCase()}<br>
          <span style="font-size: 0.7em; color: var(--text-dim); text-transform: uppercase;">${locName}</span>
        </h3>
        <table class="month-table">
            <thead>
                <tr>
                    <th>JOUR</th>
                    <th>FAJR</th>
                    <th>CHOUROUK</th>
                    <th>DHUHR</th>
                    <th>ASR</th>
                    <th>MAGHRIB</th>
                    <th>ISHA</th>
                </tr>
            </thead>
            <tbody>
    `;

    for (let i = 1; i <= daysInMonth; i++) {
        const d = new Date(year, month, i);
        const dynamicTzOffset = d.getTimezoneOffset() / -60;
        const times = calcPrayerTimes(d, lat, lng, dynamicTzOffset);
        
        const isTodayRow = isCurrentMonth && today.getDate() === i;
        
        if (times) {
            tableHTML += `
                <tr class="${isTodayRow ? 'today-row' : ''}">
                    <td>${i}</td>
                    <td>${decimalToTime(times.Fajr)}</td>
                    <td>${decimalToTime(times.Sunrise)}</td>
                    <td>${decimalToTime(times.Dhuhr)}</td>
                    <td>${decimalToTime(times.Asr)}</td>
                    <td>${decimalToTime(times.Maghrib)}</td>
                    <td>${decimalToTime(times.Isha)}</td>
                </tr>
            `;
        }
    }
    
    tableHTML += `</tbody></table>`;
    monthTableContainer.innerHTML = tableHTML;
}

monthBtn.addEventListener('click', () => {
    isMonthViewActive = !isMonthViewActive;
    if (isMonthViewActive) {
        monthTableContainer.style.display = 'block';
        printBtn.style.display = 'inline-block';
        monthBtn.textContent = "MASQUER CALENDRIER MENSUEL";
        monthBtn.style.background = "var(--neon-yellow)";
        monthBtn.style.color = "#000";
        if (currentLocation) {
            renderMonthTable(currentLocation.lat, currentLocation.lng, currentLocation.name);
        }
    } else {
        monthTableContainer.style.display = 'none';
        printBtn.style.display = 'none';
        monthBtn.textContent = "AFFICHER CALENDRIER MENSUEL";
        monthBtn.style.background = "transparent";
        monthBtn.style.color = "var(--neon-yellow)";
    }
});

printBtn.addEventListener('click', () => {
    window.print();
});

function compute(lat, lng, tzOffset_ignored, locName) {
  // [CORRECTION] Calcul dynamique du fuseau horaire (Heure d'été/hiver)
  // On ignore le tzOffset passé en paramètre (qui vient souvent d'une BDD fixe)
  // et on récupère le décalage actuel exact sur la machine de l'utilisateur.
  const dynamicTzOffset = currentDate.getTimezoneOffset() / -60;
  
  const times = calcPrayerTimes(currentDate, lat, lng, dynamicTzOffset);
  
  if (!times) {
    showError('Impossible de calculer les horaires pour cette localisation.');
    return;
  }
  renderPrayers(times, locName, lat, lng);
}

// ============================================================
// AUTOCOMPLETE & DATE NAVIGATION
// ============================================================
function filterCities(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return CITIES.filter(c => {
    const name = c.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const country = c.country.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return name.startsWith(q) || country.startsWith(q);
  }).slice(0, 8);
}

cityInput.addEventListener('input', () => {
  const matches = filterCities(cityInput.value);
  if (matches.length === 0) {
    autocomplete.classList.remove('show');
    return;
  }
  autocomplete.innerHTML = matches.map(c => `
    <div class="autocomplete-item" data-name="${c.name}" data-country="${c.country}" data-lat="${c.lat}" data-lng="${c.lng}" data-tz="${c.tz}">
      <div>${c.name}</div>
      <div class="city-country">${c.country}</div>
    </div>`).join('');
  autocomplete.classList.add('show');
});

autocomplete.addEventListener('click', (e) => {
  const item = e.target.closest('.autocomplete-item');
  if (!item) return;
  const { name, country, lat, lng, tz } = item.dataset;
  cityInput.value = name;
  autocomplete.classList.remove('show');
  currentLocation = { name: `${name}, ${country}`, lat: +lat, lng: +lng, tz: +tz };
  compute(+lat, +lng, +tz, `${name}, ${country}`);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) {
    autocomplete.classList.remove('show');
  }
});

cityInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchBtn.click();
});

searchBtn.addEventListener('click', () => {
  const q = cityInput.value.trim();
  if (!q) { showError('Veuillez saisir le nom d\'une ville.'); return; }
  const matches = filterCities(q);
  if (matches.length === 0) {
    showError('Ville non trouvée. Essayez une autre orthographe ou choisissez dans la liste.');
    return;
  }
  const c = matches[0];
  currentLocation = { name: `${c.name}, ${c.country}`, lat: c.lat, lng: c.lng, tz: c.tz };
  cityInput.value = c.name;
  autocomplete.classList.remove('show');
  compute(c.lat, c.lng, c.tz, `${c.name}, ${c.country}`);
});

// Navigate days
prevDay.addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() - 1);
  updateDateDisplay();
  if (currentLocation) {
    compute(currentLocation.lat, currentLocation.lng, currentLocation.tz, currentLocation.name);
  }
});

nextDay.addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() + 1);
  updateDateDisplay();
  if (currentLocation) {
    compute(currentLocation.lat, currentLocation.lng, currentLocation.tz, currentLocation.name);
  }
});

// ============================================================
// GEOLOCATION
// ============================================================
geoBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    showError('La géolocalisation n\'est pas supportée par votre navigateur.');
    return;
  }
  showLoading(true);
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      let locName = `${lat.toFixed(4)}° N, ${Math.abs(lng).toFixed(4)}°`;
      
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=fr`);
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.municipality || '';
        const country = data.address?.country || '';
        if (city) locName = country ? `${city}, ${country}` : city;
      } catch(e) {
        console.warn('Erreur lors du reverse geocoding, utilisation des coordonnées.');
      }
      
      showLoading(false);
      currentLocation = { name: locName, lat, lng, tz: 0 }; // tz ignoré avec la correction
      cityInput.value = locName;
      compute(lat, lng, 0, locName);
    },
    (err) => {
      showLoading(false);
      showError('Erreur de géolocalisation. Veuillez vérifier vos permissions.');
    }
  );
});
